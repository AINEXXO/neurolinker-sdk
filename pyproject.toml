[project]
name = "neurolinker-sdk"
version = "0.1.3"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LeoMarzoli", email = "leo.marzoli@ainexxo.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
]

[project.scripts]
neurolinker-sdk = "neurolinker_sdk:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.1",
    "ruff>=0.15.1",
    "urllib3>=2.6.3",
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
